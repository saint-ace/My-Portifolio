<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morris Macharia | SecOps Portfolio Simulator</title>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --card-bg: #111a2e;
            --accent: #00ff66;
            --accent-dim: #00aa44;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --error: #ff3333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .simulator-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-weight: 600;
        }

        select, input {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        .btn {
            background-color: var(--accent-dim);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background-color: var(--accent);
        }

        .terminal-box {
            background-color: #05070c;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            min-height: 150px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #33ff33;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .metric-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .metric-val {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 5px;
        }

        .metric-val.high-risk {
            color: var(--error);
        }

        .metric-val.low-risk {
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="simulator-card">
    <div class="header">
        <h2>⚡ Live Vulnerability & Risk Calculator</h2>
        <p>Interactive SecOps module mapping assets to CVE severities (CVSS v3.1 Matrix)</p>
    </div>

    <div class="form-group">
        <label for="assetType">Target Asset Architecture</label>
        <select id="assetType">
            <option value="iot">IoT Edge Network Gateway (Firmware v4.2)</option>
            <option value="database">SQLite Production Log Database</option>
            <option value="transfer">AES Encrypted File System Endpoint</option>
        </select>
    </div>

    <div class="form-group">
        <label for="cveSeverity">Simulated Exploit Severity (CVSS Base)</label>
        <select id="cveSeverity">
            <option value="9.8">Critical (9.8) - Unauthenticated Remote Code Execution</option>
            <option value="7.5">High (7.5) - Identity Access & Auth Bypass</option>
            <option value="5.3">Medium (5.3) - Information Disclosure / Data Leak</option>
        </select>
    </div>

    <div class="form-group">
        <label for="networkExposure">Network Vector Exposure</label>
        <select id="networkExposure">
            <option value="1.5">Public Facing (Unrestricted External WAN)</option>
            <option value="1.0">Internal Network Segment (Corporate LAN)</option>
            <option value="0.5">Air-gapped / Local Sandbox Isolation</option>
        </select>
    </div>

    <button class="btn" onclick="runDiagnostic()">Execute Vulnerability Sweep</button>

    <div class="terminal-box" id="terminalOutput">] System idle. Ready for diagnostic parameters...</div>

    <div class="metrics-grid">
        <div class="metric-card">
            <label>Calculated Risk Index</label>
            <div class="metric-val" id="riskIndex">0.0</div>
        </div>
        <div class="metric-card">
            <label>Mitigation Posture</label>
            <div class="metric-val" id="postureStatus">-</div>
        </div>
    </div>
</div>

<script>
    function runDiagnostic() {
        const terminal = document.getElementById('terminalOutput');
        const asset = document.getElementById('assetType').value;
        const cvss = parseFloat(document.getElementById('cveSeverity').value);
        const exposure = parseFloat(document.getElementById('networkExposure').value);

        terminal.innerHTML = "";
        terminal.innerHTML += `[INFO] Initializing risk scoring vector analysis...\n`;
        terminal.innerHTML += `[INFO] Target Identified: Target Architecture [${asset.toUpperCase()}]\n`;
        
        let progress = 0;
        const interval = setInterval(() => {
            progress += 25;
            if (progress === 25) {
                terminal.innerHTML += `[SCAN] Checking open port bindings and encryption configurations...\n`;
            } else if (progress === 50) {
                terminal.innerHTML += `[SCAN] Correlating asset signatures against active CVE databases...\n`;
            } else if (progress === 75) {
                terminal.innerHTML += `[WARN] Evaluating network exfiltration vectors & access policies...\n`;
            } else if (progress === 100) {
                clearInterval(interval);
                finalizeAssessment(cvss, exposure, asset);
            }
            terminal.scrollTop = terminal.scrollHeight;
        }, 300);
    }

    function finalizeAssessment(cvss, exposure, asset) {
        const terminal = document.getElementById('terminalOutput');
        const riskValElement = document.getElementById('riskIndex');
        const statusElement = document.getElementById('postureStatus');

        // Risk formula optimization logic
        const rawRisk = cvss * exposure;
        const roundedRisk = Math.min(Math.round(rawRisk * 10) / 10, 10.0).toFixed(1);

        riskValElement.innerText = roundedRisk;

        // Apply visual and string tracking changes
        if (roundedRisk >= 8.0) {
            riskValElement.className = "metric-val high-risk";
            statusElement.innerText = "CRITICAL";
            statusElement.style.color = "#ff3333";
            terminal.innerHTML += `[ALERT] RISK OVERFLOW DETECTED: Score ${roundedRisk}. Immediate patch enforcement required.\n`;
        } else if (roundedRisk >= 5.0) {
            riskValElement.className = "metric-val";
            statusElement.innerText = "MEDIUM";
            statusElement.style.color = "#ffaa00";
            terminal.innerHTML += `[NOTICE] System vulnerable. Review Identity Access Management (IAM) configurations.\n`;
        } else {
            riskValElement.className = "metric-val low-risk";
            statusElement.innerText = "SECURE";
            statusElement.style.color = "#00ff66";
            terminal.innerHTML += `[SUCCESS] Asset structurally sound. Defenses operating within baseline parameters.\n`;
        }
        
        terminal.innerHTML += `[SYSTEM] Assessment complete. Report compiled successfully.`;
        terminal.scrollTop = terminal.scrollHeight;
    }
</script>

</body>
</html>
